name: Atualizar cartões do README

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartoes-do-readme
  cancel-in-progress: false

env:
  STATS: "username=rodrigo-norys&show_icons=true&include_all_commits=true&locale=pt-br&hide_rank=true&hide=stars,issues,contribs&show=prs_merged,prs_merged_percentage&custom_title=Estatísticas do GitHub&hide_border=true&disable_animations=true&card_width=400"
  LANGS: "username=rodrigo-norys&layout=donut&langs_count=5&hide=batchfile,powershell,html&custom_title=Linguagens&locale=pt-br&hide_border=true&disable_animations=true"

jobs:
  cartoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Atividade, tema escuro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: "${{ env.STATS }}&theme=github_dark"
          path: profile/stats-dark.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atividade, tema claro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS }}
          path: profile/stats-light.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linguagens, tema escuro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: "${{ env.LANGS }}&theme=github_dark"
          path: profile/langs-dark.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linguagens, tema claro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGS }}
          path: profile/langs-light.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar os cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza os cartões do README"
          git pull --rebase origin main
          git push
